<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VQ Digital Wallet Google Pay SDK documentation">
  <title>VQ Digital Wallet Google Pay SDK</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f6f7fb; color: #172033; }
    main { max-width: 760px; margin: 0 auto; padding: 72px 24px; }
    .card { background: white; border: 1px solid #e2e6ef; border-radius: 16px; padding: 40px; box-shadow: 0 12px 40px rgba(23,32,51,.08); }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -.04em; }
    p { line-height: 1.65; }
    .version { display: inline-block; padding: 5px 10px; border-radius: 999px; background: #eaf0ff; color: #2449a7; font-weight: 700; }
    nav { display: grid; gap: 12px; margin-top: 28px; }
    a { color: #2449a7; font-weight: 700; }
    nav a { border: 1px solid #d8dfef; border-radius: 10px; padding: 14px 16px; text-decoration: none; }
    nav a:hover { background: #f4f7ff; }
    .note { margin-top: 28px; padding-top: 20px; border-top: 1px solid #e2e6ef; font-size: .95rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1420; color: #e7ebf3; }
      .card { background: #171e2d; border-color: #2d374a; }
      .version { background: #24345b; color: #b8cbff; }
      a { color: #b8cbff; }
      nav a, .note { border-color: #2d374a; }
      nav a:hover { background: #202a3e; }
    }
  </style>
</head>
<body>
  <main>
    <article class="card">
      <span class="version">1.1.0</span>
      <h1>Google Pay SDK</h1>
      <p>A Google Pay Web SDK delivered to merchants as one GitHub-hosted browser script.</p>
      <nav aria-label="SDK documentation">
        <a href="https://github.com/Veritas-Quaesitor/vq-digitalwallet-google#readme">Quick start and API guide</a>
        <a href="api/">Generated API reference</a>
        <a href="https://github.com/Veritas-Quaesitor/vq-digitalwallet-google/blob/main/SECURITY.md">Security policy</a>
        <a href="demo.html">Browser SDK integration demo</a>
      </nav>
      <p class="note">Load <code>vq-google-pay.js</code> once, then use the global <code>VqDigitalWalletGoogle</code> API.</p>
    </article>
  </main>
</body>
</html>
